name: Build all platforms

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev lld
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks-linux-x64
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  desktop:
    name: Desktop / ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev lld
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.target }}
          cache-on-failure: true
      - name: Compile release UI and CLI
        run: cargo build --locked --release --target ${{ matrix.target }} -p work-ui -p work-cli
      - name: Package binaries and checksums
        run: ./scripts/ci/package-build.ps1 -Target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v7
        with:
          name: rpi-work-${{ matrix.target }}
          path: target/ci-dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  web:
    name: Web / wasm32
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: web-wasm32
          cache-on-failure: true
      - name: Check WASM-specific code
        run: cargo clippy --locked -p work-ui --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Install the wasm-bindgen CLI matching Cargo.lock
        run: ./scripts/ci/install-wasm-bindgen.ps1
      - name: Compile release browser application
        run: ./scripts/build-ui-web.ps1 -BindgenPath (Get-Command wasm-bindgen -ErrorAction Stop).Source
      - name: Package standalone and rpi-web assets
        run: ./scripts/ci/package-build.ps1 -Target wasm32-unknown-unknown
      - uses: actions/upload-artifact@v7
        with:
          name: rpi-work-web
          path: target/ci-dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
