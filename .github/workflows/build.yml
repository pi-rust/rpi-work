name: GPUI desktop and Rust checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  gpui:
    name: GPUI desktop / macOS arm64
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: apps/work-gpui
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/work-gpui -> target
          shared-key: gpui-macos-arm64
          cache-on-failure: true
      - run: cargo fmt -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build GPUI release
        run: cargo build --locked --release
      - name: Package and verify the macOS application
        working-directory: ${{ github.workspace }}
        run: |
          dist=target/ci-dist
          app="$RUNNER_TEMP/RPI Work.app"
          archive=rpi-work-macos-arm64.zip
          bash ./apps/work-gpui/bundle-macos.sh apps/work-gpui/target/release/work-gpui "$app"
          mkdir -p "$dist"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$dist/$archive"
          cd "$dist"
          unzip -tq "$archive"
          extracted=$(mktemp -d "$RUNNER_TEMP/work-gpui-verify.XXXXXXXX")
          ditto -x -k "$archive" "$extracted"
          codesign --verify --strict "$extracted/RPI Work.app"
          test "$(lipo -archs "$extracted/RPI Work.app/Contents/MacOS/work-gpui")" = arm64
          shasum -a 256 "$archive" > "$archive.sha256"
          shasum -a 256 -c "$archive.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: rpi-work-macos-arm64
          path: |
            target/ci-dist/rpi-work-macos-arm64.zip
            target/ci-dist/rpi-work-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  checks:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check repository structure and workflow script paths
        run: |
          node --test tests/structure/check-structure.test.cjs
          node tools/review/check-structure.cjs
          node tools/review/check-node-boundaries.cjs
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev lld
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks-linux-x64
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - name: Build ACP fixture for production access tests
        run: cargo build --locked -p work-client --bin acp-fixture
      - name: Run workspace tests
        env:
          WORK_SESSION_ACCESS_ACP_FIXTURE: ${{ github.workspace }}/target/debug/acp-fixture
        run: cargo test --workspace --locked
      - name: Verify desktop runtime setup and recovery
        run: cargo test --locked -p work-host --features test-fixtures --test setup_flow
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
