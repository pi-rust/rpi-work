name: Build all platforms

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev lld
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks-linux-x64
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  desktop:
    name: Desktop / ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev lld
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.target }}
          cache-on-failure: true
      - name: Compile release UI and CLI
        run: cargo build --locked --release --target ${{ matrix.target }} -p work-ui -p work-cli
      - name: Package binaries and checksums
        run: ./scripts/ci/package-build.ps1 -Target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v7
        with:
          name: rpi-work-${{ matrix.target }}
          path: target/ci-dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  android:
    name: Android / ARM64 APK
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358'
          log-accepted-android-sdk-licenses: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-arm64
          cache-on-failure: true
      - name: Install verified Dioxus CLI 0.7.10
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dioxus-cli"
          curl --fail --location --retry 3 \
            https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/dioxus-cli/dx.tar.gz"
          echo "4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7  $RUNNER_TEMP/dioxus-cli/dx.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/dioxus-cli/dx.tar.gz" -C "$RUNNER_TEMP/dioxus-cli"
          echo "$RUNNER_TEMP/dioxus-cli" >> "$GITHUB_PATH"
      - name: Configure NDK
        run: |
          $ndk = Join-Path $env:ANDROID_HOME 'ndk/28.2.13676358'
          "NDK_HOME=$ndk" >> $env:GITHUB_ENV
          "ANDROID_NDK_HOME=$ndk" >> $env:GITHUB_ENV
      - name: Compile and verify installable APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if ($env:ANDROID_KEYSTORE_BASE64) {
            $keyFile = Join-Path $env:RUNNER_TEMP 'rpi-work-signing.p12'
            [IO.File]::WriteAllBytes($keyFile, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
            $env:ANDROID_KEYSTORE = $keyFile
          }
          try { ./scripts/ci/build-android.ps1 } finally {
            if ($keyFile -and (Test-Path -LiteralPath $keyFile)) { Remove-Item -LiteralPath $keyFile }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: rpi-work-android-arm64-apk
          path: target/ci-dist/*aarch64-linux-android*.apk*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish signed update release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, desktop, android, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download this run's verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir target/release-artifacts
      - name: Create and sign update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: python3 scripts/ci/create-update-manifest.py --artifacts target/release-artifacts --output target/release-upload --tag "$GITHUB_REF_NAME" --notes docs/release-notes.md
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify signatures and packages with the client implementation
        run: cargo run --locked -p work-update --bin verify-update -- target/release-upload
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/publish-release.py

  web:
    name: Web / wasm32
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: web-wasm32
          cache-on-failure: true
      - name: Check WASM-specific code
        run: cargo clippy --locked -p work-ui --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Install the wasm-bindgen CLI matching Cargo.lock
        run: ./scripts/ci/install-wasm-bindgen.ps1
      - name: Compile release browser application
        run: ./scripts/build-ui-web.ps1 -BindgenPath (Get-Command wasm-bindgen -ErrorAction Stop).Source
      - name: Package standalone and rpi-web assets
        run: ./scripts/ci/package-build.ps1 -Target wasm32-unknown-unknown
      - uses: actions/upload-artifact@v7
        with:
          name: rpi-work-web
          path: target/ci-dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
