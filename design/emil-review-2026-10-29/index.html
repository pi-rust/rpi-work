function renderTranscript(){const s=sessions.find(s=>s.id===current);let content='';if(current==='dark'){content=`<div class="date">今天 · 10 月 29 日</div><article class="message"><div class="message-head"><span class="avatar">B</span><strong>你</strong><time>14:32</time></div><div class="message-body">给工作台增加深色模式，默认跟随系统，也可以在设置里切换。桌面和手机都要适配，尽量复用现有的主题变量。<div><span class="attachment">${icon('file')}需求说明.md <small>2 KB</small></span></div></div></article><article class="message"><div class="message-head"><span class="avatar agent">r↗</span><strong>rpi</strong><small>DeepSeek · 本机执行</small></div><div class="message-body"><p>主题变量和偏好设置已经调整，手机端沿用同一套配色。</p><details class="activity"><summary><span class="tick">✓</span> 已检查 3 个文件，完成 2 项修改 <small>查看过程</small></summary><div class="steps"><div class="step"><span class="tick">✓</span>读取主题变量与设置组件 <small>0.8s</small></div><div class="step"><span class="tick">✓</span>新增深色配色与系统跟随 <small>2.1s</small></div><div class="step"><span class="tick">✓</span>保存偏好，保留键盘焦点样式 <small>1.2s</small></div></div></details><div id="state-card"></div></div></article>`}else if(s.messages.length===0){content=`<div style="padding:70px 0;max-width:530px;margin:auto"><span class="pill subtle">${escape(s.project)}</span><h2 style="margin:16px 0 8px">${escape(s.title)}</h2><p class="muted">描述你想完成的目标。回复、工具进度和需要你处理的事项都会出现在这里。</p></div>`}content+=s.messages.map(m=>message(m.text,m.agent)).join('');$('#transcript').innerHTML=content;renderStateCard()}
function renderStateCard(){const el=$('#state-card');if(!el)return;
if(phase==='completed'){el.innerHTML=`<div class="result"><div class="result-top"><span class="result-icon">${icon('check')}</span><strong>深色模式已准备好</strong></div><p>默认跟随系统，也可以手动切换。组件测试 24 / 24 通过。</p><div class="result-files"><span>工作区示例</span>${files.map(f=>`<code>${f.path.split('/').pop()}</code>`).join('')}</div><button class="primary" data-action="review">查看工作区变更 ${icon('back').replace('class="ico"','class="ico" style="transform:rotate(180deg)"')}</button> <small>3 个文件 · +67 −10</small></div>`}

function renderState(){const [title,label,tone]=stateLabels[phase];$('#header-status').className=`pill ${tone} header-status`;$('#header-status').innerHTML=`<i class="dot"></i>${title}`;$('#run-label').textContent=label;$('#run-dot').style.color=`var(--${tone==='good'?'green':tone==='bad'?'red':tone==='warn'?'amber':'blue'})`;$('#node-label').textContent=phase==='offline'?'这台电脑 · 连接中断':'这台电脑 · 已连接';$('#connection-foot').textContent=phase==='offline'?'连接已中断 · 草稿已保留':'本机执行';$('#queue-button').hidden=queue.length===0;$('#queue-count').textContent=queue.length;const stop=phase==='running'||phase==='cancelling';$('#enqueue').hidden=phase!=='running'||!$('#prompt').value.trim();$('#send').innerHTML=icon(stop?'stop':'up');$('#send').setAttribute('aria-label',stop?'停止执行':'发送消息');$('#send').disabled=phase==='offline'||phase==='cancelling'||(!stop&&!$('#prompt').value.trim());if($('#scenario').querySelector(`option[value="${phase}"]`))$('#scenario').value=phase;renderStateCard()}

 'theme':()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('meta[name="theme-color"]').content=dark?'#1b1e1a':'#fafaf7';notify(dark?'已切换深色主题':'已切换浅色主题')},'context':openContext,
 'search':()=>{openDialog('搜索项目与会话','<label class="field" for="search-input">会话标题或项目名</label><input id="search-input" type="text" placeholder="搜索会话…"><div class="search-results" id="search-results"></div>');renderSearch('');$('#search-input').addEventListener('input',e=>renderSearch(e.target.value))},
 'new':()=>openDialog('新建任务','<p>在 rpi-work 中创建一个本地演示会话。</p><label class="field" for="new-title">任务目标</label><input id="new-title" type="text" placeholder="例如：整理登录页的交互"><div class="actions"><button class="primary" data-action="create-task">创建并开始</button></div>'),
 'create-task':()=>{const title=$('#new-title').value.trim();if(!title){$('#new-title').focus();return}const id='new-'+Date.now();sessions.push({id,title,project:'rpi-work',draft:'',messages:[]});closeDialog();selectSession(id);$('#prompt').focus()},
 'review':()=>changeView('changes'),'file-list':()=>{$('#review-grid').classList.remove('detail');$('#change-files button').focus()},'skills':openSkills,
 'save-skills':()=>{$$('[data-skill]').forEach(el=>el.checked?skills.add(el.dataset.skill):skills.delete(el.dataset.skill));$('#skill-count').textContent=skills.size;closeDialog();notify('会话 Skills 选择已保存（演示）')},'queue':openQueue,'attach':()=>$('#file-input').click(),
 'more':()=>openDialog('会话操作','<p>低频操作集中在这里，保留输入区的阅读空间。</p><div class="search-results"><button data-action="aside-question">BTW 旁问</button><button data-action="queue">消息队列</button><button data-action="skills">会话 Skills</button><button data-action="context">上下文与运行详情</button></div>'),
 'aside-question':()=>openDialog('BTW 旁问','<p>旁问与主任务分开。此原型仅演示编辑与本地答复。</p><label class="field" for="aside-input">你的问题</label><input id="aside-input" type="text" placeholder="例如：为什么使用系统主题？"><div class="actions"><button class="primary" data-action="ask-aside">发送旁问</button></div><div id="aside-answer" role="status"></div>'),
 'ask-aside':()=>{if(!$('#aside-input').value.trim())return;$('#aside-answer').textContent='示例答复：跟随系统主题可以减少用户重复设置，同时保留手动覆盖入口。此回复是固定演示文案。'},
 'allow':()=>{startRun();notify('已授权一次，正在等待执行结果')},'deny':()=>{setPhase('interrupted');notify('本次执行已拒绝')},'reconnect':()=>{notify('正在模拟重新连接并同步状态');setPhase('running');timer=setTimeout(()=>{setPhase('completed');notify('同步完成：节点报告任务已完成')},1000)},
 'fix':()=>{$('#prompt').value='请修复 system_preference 测试失败，保留跟随系统的默认行为。';renderState();$('#prompt').focus()},
 'files':()=>openDialog('项目文件',`<p>只读浏览 · D:/Projects/${escape(sessions.find(s=>s.id===current).project)}</p><div class="search-results">${files.map((f,i)=>`<button data-preview="${i}">${icon('file')}<code>${f.path}</code></button>`).join('')}</div><div id="file-content"></div>`),
 'library':()=>openDialog('能力库','<p>将安装与会话选择分开：先在库中了解能力，再选择当前任务需要的内容。</p><div class="detail-group"><h3>已安装 Skills</h3><p class="muted">emil-design-eng、animate、mobile-native</p><div class="actions"><button class="outline" data-action="skills">选择会话 Skills</button></div></div><div class="detail-group"><h3>Tools 与 Packages</h3><p class="muted">工具来自执行节点。能力安装与版本管理不在此交互原型范围内。</p></div>'),
 'settings':()=>openDialog('设置','<div class="detail-group"><h3>外观</h3><p class="muted">保留暖色中性背景，减少装饰性层级。</p><div class="actions"><button class="outline" data-action="theme">切换深浅主题</button></div></div><div class="detail-group"><h3>执行节点</h3><div class="detail-row"><span>当前节点</span><span>这台电脑 · 演示</span></div><p class="muted">本原型不连接真实节点，连接恢复可通过顶部场景切换体验。</p></div>')
};
function renderSearch(q){const matches=sessions.filter(s=>(s.title+' '+s.project).toLowerCase().includes(q.toLowerCase()));$('#search-results').innerHTML=matches.length?matches.map(s=>`<button data-search-session="${s.id}">${icon('file')}<span>${escape(s.title)}<small style="display:block">${escape(s.project)}</small></span></button>`).join(''):'<p class="muted">没有找到会话，试试其他关键词。</p>'}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.action){e.preventDefault();actions[el.dataset.action]?.()}else if(el.dataset.session){selectSession(el.dataset.session)}else if(el.dataset.searchSession){closeDialog();selectSession(el.dataset.searchSession)}else if(el.dataset.view){changeView(el.dataset.view)}else if(el.dataset.file!==undefined){selectedFile=+el.dataset.file;renderDiff();$('#review-grid').classList.add('detail');if(innerWidth<=700)$('#diff-code').focus()}else if(el.dataset.preview!==undefined){const f=files[+el.dataset.preview];$('#file-content').innerHTML=`<h3 style="margin-top:15px">${escape(f.path)}</h3><pre class="file-preview">${escape(f.next)}</pre>`}else if(el.dataset.removeQueue!==undefined){queue.splice(+el.dataset.removeQueue,1);openQueue();renderState()}else if(el.dataset.editQueue!==undefined){const i=+el.dataset.editQueue;const text=queue.splice(i,1)[0];$('#prompt').value=[$('#prompt').value,text].filter(Boolean).join('\n');sessions.find(s=>s.id===current).draft=$('#prompt').value;closeDialog();renderState();$('#prompt').focus()}else if(el.dataset.removeAttachment!==undefined){attachments.splice(+el.dataset.removeAttachment,1);renderAttachments()}});
$('#scrim').addEventListener('click',closeNav);
// Mobile navigation is modal to keyboard users; keep focus inside until dismissed.
$('#sidebar').addEventListener('keydown',e=>{if(e.key!=='Tab'||innerWidth>700||!$('#sidebar').classList.contains('open'))return;const items=[...$('#sidebar').querySelectorAll('button:not(:disabled)')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
window.addEventListener('resize',()=>{$('#sidebar').inert=innerWidth<=700&&!$('#sidebar').classList.contains('open')});
renderSessions();renderTranscript();renderState();$('#sidebar').inert=innerWidth<=700;
</script>
</html>
