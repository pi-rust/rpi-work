[package]
name = "parity-module-check"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["meta", "resources"]
meta = []
resources = []
trace = []
project = []
extras = []
conversation = []
settings = []
queue = []
scroll = []

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
work-client = { path = "../../../crates/work-client" }
work-core = { path = "../../../crates/work-core" }

work-update = { path = "../../../crates/work-update" }
gloo-timers = { version = "0.3", features = ["futures"] }
tokio = { version = "1", features = ["time"] }
