[package]
name = "work-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
work-node-host = { path = "../work-node-host" }
work-http-runtime = { path = "../../transport/work-http-runtime" }
work-client = { path = "../../client/work-client" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "signal", "time", "sync", "macros"] }

[dev-dependencies]
work-component-api = { path = "../../components/work-component-api" }
