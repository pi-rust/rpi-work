[package]
publish = false
name = "work-node-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/pi-rust/rpi-work"

description = "Native node ownership, startup and shutdown shared by rpi extensions"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
work-http-component = { path = "../../components/work-http-component", version = "0.1.0" }
work-node-runtime = { path = "../../node/work-node-runtime", version = "0.1.0" }
work-node-service = { path = "../../transport/work-node-service", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt", "signal", "time", "sync", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_IO"] }
