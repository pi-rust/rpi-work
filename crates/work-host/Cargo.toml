[package]
name = "work-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
rpi-node-host = { path = "../../vendor/rpi-node-host" }
rpi-node-launcher = { path = "../../vendor/rpi-node-launcher" }
rpi-http-runtime = { path = "../../vendor/rpi-http-runtime" }
rpi-components = { path = "../../vendor/rpi-components" }
work-client = { path = "../work-client" }
work-node = { path = "../work-node" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "signal", "time", "sync", "macros"] }
