[package]
name = "work-node"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
work-node-runtime = { path = "../work-node-runtime" }

[dev-dependencies]
work-core = { path = "../../foundation/work-core" }
async-trait = "0.1"
futures-util = "0.3"
tempfile = "3"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dev-dependencies]
rpi-extcore = { git = "https://github.com/pi-rust/rpi-package", rev = "17ba89c0098f018db76e22051fe8c73e2792dc1c" }
