[package]
publish = false
name = "work-node-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/pi-rust/rpi-work"

description = "Shared workspace owner for native rpi node extensions"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
work-component-api = { path = "../../components/work-component-api", version = "0.1.0" }
thiserror = "2"
getrandom = "0.3"
fs2 = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-stream = "0.3"
async-trait = "0.1"
futures-core = "0.3"
futures-util = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }
url = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
work-node-api = { path = "../../foundation/work-node-api", version = "0.1.0" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
rpi-extcore = { version = "=0.2.11", git = "https://github.com/pi-rust/rpi-package", rev = "1e3c9551a054fe3bb6f2ef905429268bc4a7e5bd" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
