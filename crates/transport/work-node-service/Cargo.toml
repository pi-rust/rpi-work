[package]
publish = false
name = "work-node-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/pi-rust/rpi-work"

description = "HTTP/WebSocket adapter for an existing multi-project node owner"

[lints.rust]
unsafe_code = "warn"
[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
work-http-runtime = { path = "../work-http-runtime", version = "0.1.0" }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs"] }
work-node-runtime = { path = "../../node/work-node-runtime", version = "0.1.0" }
work-node-api = { path = "../../foundation/work-node-api", version = "0.1.0" }
rpi-node-core = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", features = ["sink"] }
url = "2"

[dev-dependencies]
work-client = { path = "../../client/work-client" }
work-component-api = { path = "../../components/work-component-api" }
work-http-component = { path = "../../components/work-http-component" }
work-core = { path = "../../foundation/work-core" }
tempfile = "3"
socket2 = "0.6"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "stream"] }
sha2 = "0.10"

[[bin]]
name = "work-server-rpc-fixture"
path = "tests/support/rpc-fixture.rs"
