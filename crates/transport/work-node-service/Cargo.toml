[package]
publish = false
name = "work-node-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/pi-rust/rpi-work"

description = "HTTP/SSE/WebSocket adapter for an existing multi-project node owner"

[lints.rust]
unsafe_code = "warn"
[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
work-http-runtime = { path = "../work-http-runtime", version = "0.1.0" }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs"] }
work-node-runtime = { path = "../../node/work-node-runtime", version = "0.1.0" }
work-node-api = { path = "../../foundation/work-node-api", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", features = ["sink"] }
async-stream = "0.3"
url = "2"

[dev-dependencies]
tempfile = "3"
