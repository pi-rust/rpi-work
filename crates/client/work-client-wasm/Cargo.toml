[package]
name = "work-client-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
publish = false
description = "wasm-bindgen surface for work-client, so a Web renderer keeps the node protocol in Rust."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
work-client = { path = "../work-client" }
