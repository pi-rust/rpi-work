[package]
publish = false
name = "work-component-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/pi-rust/rpi-work"

description = "Versioned component packages and isolated custom UI contracts"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"
