[package]
name = "work-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lints.rust]
unsafe_code = "warn"
[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
rpi-http-node = { path = "../../vendor/rpi-http-node" }
rpi-http-runtime = { path = "../../vendor/rpi-http-runtime" }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs"] }
work-node = { path = "../work-node" }
work-core = { path = "../work-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", features = ["sink"] }
async-stream = "0.3"
sha2 = "0.10"
subtle = "2"
url = "2"
getrandom = "0.3"

[dev-dependencies]
rpi-http-component = { path = "../../vendor/rpi-http-component" }
# Constrain the isolated slow peer's receive window, not production sockets.
socket2 = "0.6"
work-client = { path = "../work-client" }
tempfile = "3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "stream"] }

# Protocol fixture; no installed rpi process is touched.
[[bin]]
name = "work-server-rpc-fixture"
path = "tests/support/rpc-fixture.rs"
