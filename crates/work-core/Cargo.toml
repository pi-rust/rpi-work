[package]
name = "work-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"
