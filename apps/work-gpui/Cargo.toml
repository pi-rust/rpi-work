# Standalone workspace: gpui pins `cocoa = "=0.26.0"`, which cannot coexist with
# the dioxus desktop stack (`cocoa ^0.26.1`) inside the product workspace.
[workspace]

[package]
name = "work-gpui"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
publish = false
description = "Native GPUI workbench for RPI Work."

# macOS with Command Line Tools only (no Xcode) cannot run `xcrun metal` at build
# time, so this prototype compiles gpui shaders at runtime. Release builds should
# use the default feature set and a full Xcode toolchain.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
raw-window-handle = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
gpui = "0.2.2"

[dependencies]
base64 = "0.22"
rpi-extcore = { version = "=0.2.16", git = "https://github.com/pi-rust/rpi-extension", rev = "b26b7d2ac216fece915229d19145ac7ef8675426" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
unicode-segmentation = "1"
work-client = { path = "../../crates/client/work-client" }
work-core = { path = "../../crates/foundation/work-core" }
work-host = { path = "../../crates/host/work-host" }
work-viewmodel = { path = "../../crates/client/work-viewmodel" }

[build-dependencies]
cc = "1"

[patch.crates-io]
# GPUI's zed-async-tar still requires xattr 0.2, which uses libc::ENOATTR on Linux.
xattr = { path = "compat/xattr" }
