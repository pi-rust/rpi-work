[package]
name = "work-ui"
version = "0.1.12"
edition = "2024"
rust-version = "1.85"
publish = false

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[features]
default = []
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
web = ["dioxus/web"]

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
work-host = { path = "../../crates/host/work-host" }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "android")'.dependencies]
dioxus = { version = "0.7", features = ["mobile"] }
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The static web bundle is served without the Dioxus devserver endpoint. Keep
# web rendering/launch support, but do not include debug hot-reload tooling.
dioxus = { version = "0.7", default-features = false, features = ["launch", "lib", "web"] }
# dioxus-web's history support needs this web-sys binding even when its
# devtools feature is intentionally disabled.
web-sys = { version = "0.3", features = ["Location"] }
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time"] }

[dependencies]
base64 = "0.22"
sha2 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"
work-client = { path = "../../crates/client/work-client" }
work-core = { path = "../../crates/foundation/work-core" }
work-update = { path = "../../crates/update/work-update" }

[build-dependencies]
embed-resource = "=3.0.6"
