[application]
name = "RPI Work"
android_main_activity = "android/MainActivity.kt"
android_manifest = "android/AndroidManifest.xml"

[bundle]
identifier = "com.pirust.rpiwork"
publisher = "pi-rust"
short_description = "Connect to your computer's agent workspace"

[android]
min_sdk = 24
target_sdk = 35
compile_sdk = 35

[android.application]
uses_cleartext_traffic = true

[android.permissions."android.permission.INTERNET"]
description = "Connect to the user's rpi-http or rpi-web node"

[android.permissions."android.permission.REQUEST_INSTALL_PACKAGES"]
description = "Ask Android to install a verified app update"

[permissions.camera]
description = "Scan the connection QR code displayed on your computer"
